<!doctype html>
<html lang="es">
  <head>
    <title>Alta de usuario - Academia</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Alta de usuario</h1>

      <form>
        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Introduce tu nombre"
          />
        </div>

        <!-- Apellidos -->
        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input
            type="text"
            class="form-control"
            id="apellidos"
            placeholder="Introduce tus apellidos"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="nombre@ejemplo.com"
          />
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Introduce tu contraseña"
          />
        </div>

        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input
            type="tel"
            class="form-control"
            id="telefono"
            placeholder="Introduce tu teléfono"
          />
        </div>

        <!-- Fecha de nacimiento -->
        <div class="form-group">
          <label for="fecha">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="fecha" />
        </div>

        <!-- Curso -->
        <div class="form-group">
          <label for="curso">Curso que quieres realizar</label>
          <select class="form-control" id="curso">
            <option>Selecciona un curso</option>
            <option>Desarrollo Web</option>
            <option>Programación Java</option>
            <option>Diseño Gráfico</option>
            <option>Marketing Digital</option>
          </select>
        </div>

        <!-- Modalidad -->
        <div class="form-group">
          <label>Modalidad</label>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="modalidad"
              id="presencial"
              value="presencial"
            />
            <label class="form-check-label" for="presencial">
              Presencial
            </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="modalidad"
              id="online"
              value="online"
            />
            <label class="form-check-label" for="online"> Online </label>
          </div>
        </div>

        <!-- Aceptar condiciones -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="condiciones" />
          <label class="form-check-label" for="condiciones">
            Acepto los términos y condiciones
          </label>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-primary">Darme de alta</button>

        <button type="reset" class="btn btn-secondary">Limpiar</button>
      </form>
    </div>
  </body>
</html>
